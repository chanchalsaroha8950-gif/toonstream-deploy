services:
  - type: web
    name: toonstream-sync
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node sync-server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: USE_PROXY
        sync: false
      - key: PROXY_LIST
        sync: false
      - key: CRON_SCHEDULE
        value: "*/1 * * * *"
      - key: POLL_INTERVAL_MS
        value: 60000
      - key: MAX_PARALLEL_SERIES
        value: 4
      - key: LATEST_AUDIT_LIMIT
        value: 25
      - key: EMPTY_SERVERS_AUDIT_LIMIT
        value: 50
    healthCheckPath: /
    autoDeploy: true
